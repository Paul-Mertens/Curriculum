<!DOCTYPE html>
<!-- Stand: 2026-10-01 · Änderung 4 -->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rechnen mit Dezimalzahlen</title>
<style>
:root{
  --papier:#fbfcfe; --karo:#d6e2f0; --tinte:#1f3a93; --blei:#4a4f57;
  --rot:#c8102e; --gruen:#2e7d32; --flaeche:#ffffff; --karo-grund:#e8eef6;
  --schrift:"Liberation Sans",Arial,Helvetica,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:var(--schrift); color:var(--blei); background:var(--papier);
  background-image:
    linear-gradient(var(--karo-grund) 1px,transparent 1px),
    linear-gradient(90deg,var(--karo-grund) 1px,transparent 1px);
  background-size:20px 20px; min-height:100vh; padding:2rem 1rem;
}
.rahmen{max-width:40rem;margin:0 auto}
.reiter{display:flex;gap:.3rem;border-bottom:2px solid var(--tinte);margin:0 0 1.5rem}
button.nav{font-size:1rem;padding:.5rem 1.1rem;border-bottom:0;border-radius:4px 4px 0 0;background:var(--flaeche);color:var(--tinte)}
button.nav[aria-current=page]{background:var(--tinte);color:#fff}
main{min-width:0}
.liste{margin:0 0 1rem}
.liste h2{margin:0 0 .5rem}
.hinweis{margin:0 0 1.5rem;font-size:1.2rem;line-height:1.6;color:#2b2f36}
table.zeiten{width:auto}
table.zeiten td{border:0;padding:.15rem 1.5rem .15rem 0;font-size:.95rem;vertical-align:baseline}
table.zeiten td:first-child{text-align:right}
table.zeiten td:last-child{text-align:left;padding-right:0}
table.zeiten tr.spitze td:first-child{font-size:2rem;font-weight:700;color:var(--tinte)}
h1{color:var(--tinte);font-size:2rem;margin:0 0 1.5rem}
h2{color:var(--tinte);font-size:1.25rem;margin:2rem 0 .5rem}
section{background:var(--flaeche);border:2px solid var(--tinte);border-radius:4px;padding:1.5rem}
[hidden]{display:none!important}
fieldset{border:0;margin:0 0 1.25rem;padding:0}
legend{font-weight:700;color:var(--tinte);margin-bottom:.5rem}
.arten{display:flex;flex-wrap:wrap;gap:.5rem}
.arten label{display:flex;align-items:center;gap:.4rem;border:1px solid var(--karo);padding:.4rem .7rem;border-radius:4px;cursor:pointer}
.reihe{display:flex;flex-wrap:wrap;gap:1rem}
.reihe label{display:flex;flex-direction:column;gap:.25rem;font-size:.9rem}
input[type=number],input[type=text],select{font:inherit;font-size:1.1rem;padding:.4rem .5rem;width:8rem;border:1px solid var(--blei);border-radius:3px}
button{font:inherit;font-weight:700;font-size:1.1rem;padding:.6rem 1.2rem;border:2px solid var(--tinte);border-radius:4px;background:var(--tinte);color:#fff;cursor:pointer}
button.zweit{background:transparent;color:var(--tinte)}
:focus-visible{outline:3px solid var(--rot);outline-offset:2px}
.meldung{color:var(--rot);min-height:1.4em;margin:.75rem 0 0}
.kopf{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;font-size:1.1rem}
.uhr{font-weight:700;color:var(--tinte)}
.aufgabe{display:flex;align-items:baseline;justify-content:center;flex-wrap:wrap;gap:.5rem;margin:2.5rem 0 1.5rem;font-size:clamp(2.2rem,8vw,3.6rem);color:var(--tinte);font-variant-numeric:tabular-nums}
.aufgabe input{font-size:inherit;width:5.5ch;text-align:center;border:0;border-bottom:3px solid var(--tinte);border-radius:0;color:var(--tinte);background:transparent;padding:0}
.aufgabe input:focus-visible{outline:none;border-bottom-color:var(--rot)}
.rueck{text-align:center;min-height:1.5em;font-size:1.1rem}
.richtig{color:var(--gruen)} .falsch{color:var(--rot)}
.stufe{font-size:1.6rem;color:var(--tinte);font-weight:700;margin:0 0 .5rem;white-space:pre-line;line-height:1.35}
.zahlen{display:grid;grid-template-columns:repeat(auto-fit,minmax(8rem,1fr));gap:.75rem;margin:1rem 0}
.zahlen div{border-left:3px solid var(--tinte);padding-left:.6rem}
.zahlen b{display:block;font-size:1.4rem;color:var(--tinte);font-variant-numeric:tabular-nums}
.tab{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:.35rem .5rem;border-bottom:1px solid var(--karo)}
th:first-child,td:first-child{text-align:left}
th{color:var(--tinte)}
.knoepfe{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:1.5rem}
.klein{font-size:.85rem;margin:.5rem 0 0}
.bestzeit{font-size:1.15rem;font-weight:700;color:var(--gruen);margin:0 0 .5rem}
.bestzeit.leise{color:var(--blei);font-weight:400}
.haken{display:flex;align-items:center;gap:.4rem;margin-top:.75rem}
select{width:auto;min-width:16rem;background:#fff}
.aufgabe button{font-size:1.3rem;align-self:center;padding:.5rem 1rem}
.auftrag{text-align:center;font-size:1.25rem;margin:2rem 0 0;min-height:1.5em}
.auftrag + .aufgabe{margin-top:1rem}
.tasten{display:flex;justify-content:center;gap:1rem;margin:0 0 1rem}
.tasten button{font-size:2.2rem;min-width:5rem;padding:.3rem 1rem;line-height:1.2}
.bruch{display:inline-flex;flex-direction:column;align-items:center;line-height:1.05;vertical-align:middle;font-size:.75em}
.bruch span:first-child{border-bottom:3px solid currentColor;padding:0 .2em .08em}
.bruch span:last-child{padding:.08em .2em 0}
.rueck .bruch,td .bruch{font-size:.9em;margin:0 .1em}
#stellen,#bis{min-width:5rem}
.fragezeichen{display:inline-block;min-width:1.4em;text-align:center;border-bottom:3px solid var(--tinte)}
.antwort{display:inline-flex;align-items:baseline;gap:.5rem;white-space:nowrap}
</style>
</head>
<body>
<div class="rahmen">
<nav class="reiter" aria-label="Bereiche">
  <button class="nav" type="button" data-ziel="uebung" aria-current="page">Rechnen mit Dezimalzahlen</button>
  <button class="nav" type="button" data-ziel="bestenliste">Bestzeiten</button>
</nav>
<main>
<div id="bereich-uebung">
<h1>Rechnen mit Dezimalzahlen</h1>

<section id="einstellung">
  <fieldset>
    <legend>Vorgabe</legend>
    <select id="vorgabe" aria-label="Vorgabe"></select>
  </fieldset>
  <fieldset>
    <legend>Rechenarten</legend>
    <div class="arten">
      <label><input type="checkbox" name="art" value="add"> Plus</label>
      <label><input type="checkbox" name="art" value="sub"> Minus</label>
      <label><input type="checkbox" name="art" value="mul"> Mal</label>
      <label><input type="checkbox" name="art" value="div"> Geteilt</label>
      <label><input type="checkbox" name="art" value="zehn"> Mal und geteilt mit 10, 100, 1000</label>
    </div>
  </fieldset>
  <fieldset>
    <legend>Zahlen</legend>
    <div class="reihe">
      <label>Nachkommastellen bis <select id="stellen"><option value="1">1</option><option value="2">2</option></select></label>
      <label id="labelBis">Plus und Minus bis <select id="bis"><option value="1">1</option><option value="10">10</option><option value="100">100</option></select></label>
    </div>
  </fieldset>
  <fieldset>
    <legend>Runden</legend>
    <div class="reihe">
      <label>Anzahl <input type="number" id="runden" value="10" min="1" max="200" step="1"></label>
    </div>
  </fieldset>
  <button id="start" type="button">Start</button>
  <p class="meldung" id="fehler" role="alert"></p>
</section>

<section id="uebung" hidden>
  <div class="kopf"><span id="fortschritt"></span><span class="uhr" id="uhr">0:00,0</span></div>
  <p class="auftrag" id="auftrag"></p>
  <div class="aufgabe">
    <span id="term"></span>
    <span class="antwort"><span id="zeichen"></span><input id="eingabe" type="text" inputmode="numeric" autocomplete="off" aria-label="Antwort"><span id="einheit"></span></span>
    <button id="ok" type="button">OK</button>
  </div>
  <div class="tasten" id="tasten" hidden></div>
  <p class="rueck" id="rueck" aria-live="polite"></p>
  <div class="knoepfe"><button class="zweit" id="abbruch" type="button">Abbrechen</button></div>
</section>

<section id="ergebnis" hidden>
  <p class="stufe" id="stufe"></p>
  <p class="bestzeit" id="bestzeit"></p>
  <div class="zahlen" id="kennzahlen"></div>
  <h2 id="gruppenKopf"></h2>
  <div class="tab"><table id="tabGruppe"></table></div>
  <h2 id="fehlerKopf">Fehler</h2>
  <div class="tab"><table id="tabFehler"></table></div>
  <div class="knoepfe">
    <button id="nochmal" type="button">Nochmal</button>
    <button class="zweit" id="auswahl" type="button">Zur Auswahl</button>
  </div>
</section>
</div>
<div id="bereich-bestenliste" hidden>
<h1>Bestzeiten fehlerfreier Durchläufe</h1>
<p class="hinweis">Hier zählen nur Durchgänge ohne Fehler.<br>Sorgfalt ist wichtiger als Tempo.<br>Ein einziger Fehler kostet dich mehr als jede Sekunde, die du durch Eile gewinnst.</p>
<div id="listen"></div>
</div>
</main>
</div>

<script>
const KONFIG = {
  genauigkeit: [[0.90, "sicher"], [0.70, "teils sicher"], [0.00, "unsicher"]],
  tempo: [[1.00, "schnell"], [0.60, "mittel"], [0.00, "langsam"]],
  rueckmeldung: [
    ["Schnell und richtig. Stark!", "Du rechnest sicher. Mit etwas Übung wirst du auch schneller.", "Du rechnest sicher. Das Tempo kommt beim Üben von allein."],
    ["Du bist schnell. Wenn du etwas genauer hinschaust, stimmen noch mehr Ergebnisse.", "Du bist auf einem guten Weg. Achte zuerst auf richtige Ergebnisse.", "Übe weiter. Achte zuerst darauf, dass die Ergebnisse stimmen."],
    ["Du rechnest sehr schnell. Nimm dir etwas mehr Zeit, dann stimmen mehr Ergebnisse.", "Einige Ergebnisse stimmen noch nicht. Nimm dir Zeit und rechne in Ruhe.", "Diese Aufgaben sind noch schwer für dich. Übe sie in Ruhe weiter, jede Runde hilft."]
  ],
  listenlaenge: 4
};

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const zufall = (r, lo, hi) => lo + Math.floor(r() * (hi - lo + 1));
const waehle = (r, liste) => liste[zufall(r, 0, liste.length - 1)];
const gruppiert = n => { const s = String(n); return s.length >= 5 ? s.replace(/\B(?=(\d{3})+(?!\d))/g, "\u202f") : s; };

const ARTEN = ["add", "sub", "mul", "div", "zehn"];
const GNAME = { add: "Plus", sub: "Minus", mul: "Mal", div: "Geteilt", zehn: "Mal und geteilt mit 10, 100, 1000" };
const SOLL = { add: 4, sub: 5, mul: 4, div: 5, zehn: 4 };
const P = n => Math.pow(10, n);
function dez(einheiten, stellen) {
  const s = String(einheiten).padStart(stellen + 1, "0");
  const ganz = s.slice(0, s.length - stellen), rest = stellen ? s.slice(s.length - stellen).replace(/0+$/, "") : "";
  return rest ? ganz + "," + rest : ganz;
}
function kanonisch(s) {
  const m = s.match(/^(\d*)(?:,(\d*))?$/);
  if (!m || (m[1] === "" && !m[2])) return null;
  const ganz = String(Number(m[1] || "0"));
  const rest = (m[2] || "").replace(/0+$/, "");
  return rest ? ganz + "," + rest : ganz;
}
function zahlMit(r, stellen, maxEinheiten) {
  for (let v = 0; v < 50; v++) {
    const n = zufall(r, 1, maxEinheiten);
    if (stellen === 0 || n % 10 !== 0) return n;
  }
  return null;
}
function plus(r, k, M) {
  for (let v = 0; v < 100; v++) {
    const da = zufall(r, 0, k), db = zufall(r, 0, k);
    if (da === 0 && db === 0) continue;
    const A = zahlMit(r, da, M * P(da) - 1);
    if (A === null) continue;
    const a = A * P(k - da);
    const rest = M * P(k) - a - 1;
    const bMax = Math.floor(rest / P(k - db));
    if (bMax < 1) continue;
    const B = zahlMit(r, db, bMax);
    if (B === null) continue;
    const b = B * P(k - db);
    return { a: dez(a, k), b: dez(b, k), summe: dez(a + b, k) };
  }
  return null;
}
const H = {
  speicher: "htmlhelper:dezimalrechnen:bestenliste",
  modus: "eingabe", inputMode: "decimal", eingabeBreite: "6ch", zeichen: "=", rundenWort: "Runden",
  eingabeHinweis: "Bitte eine Zahl eingeben, etwa 0,75.",
  gruppenName: "Rechenart", gruppen: ARTEN.map(a => GNAME[a]),
  VORGABEN: [
    { id: "pm1", name: "Plus und Minus mit Zehnteln bis 10", arten: ["add", "sub"], k: 1, bis: 10 },
    { id: "pm3", name: "Plus und Minus mit Zehnteln bis 100", arten: ["add", "sub"], k: 1, bis: 100 },
    { id: "pm2", name: "Plus und Minus mit Hundertsteln bis 10", arten: ["add", "sub"], k: 2, bis: 10 },
    { id: "zehn", name: "Mal und geteilt mit 10, 100, 1000", arten: ["zehn"], k: 2, bis: 10 },
    { id: "md1", name: "Mal und geteilt mit Zehnteln", arten: ["mul", "div"], k: 1, bis: 10 },
    { id: "md2", name: "Mal und geteilt bis Hundertstel", arten: ["mul", "div"], k: 2, bis: 10 },
    { id: "alle", name: "Alles gemischt", arten: ["add", "sub", "mul", "div", "zehn"], k: 2, bis: 10 }
  ],
  setzen($, v) {
    document.querySelectorAll("input[name=art]").forEach(c => { c.checked = v.arten.includes(c.value); });
    $("stellen").value = String(v.k); $("bis").value = String(v.bis);
  },
  sichtbarkeit($) {
    const arten = [...document.querySelectorAll("input[name=art]:checked")].map(c => c.value);
    $("labelBis").hidden = !(arten.includes("add") || arten.includes("sub"));
  },
  lesen($) {
    const arten = [...document.querySelectorAll("input[name=art]:checked")].map(c => c.value);
    if (!arten.length) return "Bitte mindestens eine Rechenart wählen.";
    return { arten, k: Number($("stellen").value), bis: Number($("bis").value) };
  },
  ausVorgabe(v) { return { arten: v.arten, k: v.k, bis: v.bis }; },
  schluessel(e) {
    const s = { arten: ARTEN.filter(a => e.arten.includes(a)), k: e.k };
    if (e.arten.includes("add") || e.arten.includes("sub")) s.bis = e.bis;
    return s;
  },
  beschreibung(e) {
    const t = [ARTEN.filter(a => e.arten.includes(a)).map(a => GNAME[a]).join(", "), e.k === 1 ? "Zehntel" : "bis Hundertstel"];
    if (e.arten.includes("add") || e.arten.includes("sub")) t.push("bis " + e.bis);
    return t.join(", ");
  },
  erzeuge(r, e) {
    const art = waehle(r, e.arten), k = e.k;
    if (art === "add" || art === "sub") {
      const p = plus(r, k, e.bis);
      return art === "add" ? { art, term: `${p.a} + ${p.b}`, erg: p.summe } : { art, term: `${p.summe} − ${p.a}`, erg: p.b };
    }
    if (art === "zehn") {
      const d = zufall(r, 1, k), A = zahlMit(r, d, P(d + 1) * 9);
      const f = waehle(r, [10, 100, 1000]), mal = f === 1000 || r() < 0.5;
      const s = Math.log10(f);
      if (mal) return { art, term: `${dez(A, d)} · ${f}`, erg: kanonisch(dez(A * P(Math.max(0, s - d)), Math.max(0, d - s))) };
      return { art, term: `${dez(A, d)} : ${f}`, erg: kanonisch(dez(A, d + s)) };
    }
    const x = zufall(r, 2, 9), y = zufall(r, 2, 9);
    if (art === "mul") {
      const s1 = zufall(r, 1, k), s2 = zufall(r, 0, k - s1);
      const [l, rr] = r() < 0.5 ? [dez(x, s1), dez(y, s2)] : [dez(y, s2), dez(x, s1)];
      return { art, term: `${l} · ${rr}`, erg: kanonisch(dez(x * y, s1 + s2)) };
    }
    const sx = zufall(r, 0, Math.min(1, k)), sq = zufall(r, sx === 0 ? 1 : 0, k - sx);
    return { art, term: `${dez(x * y, sx + sq)} : ${dez(x, sx)}`, erg: kanonisch(dez(y, sq)) };
  },
  auftrag() { return ""; },
  zeige(t) { return t.term; },
  einheit() { return ""; },
  text(t) { return t.term; },
  loesung(t) { return t.erg; },
  satz(t) { return `${t.term} = ${t.erg}`; },
  gruppe(t) { return GNAME[t.art]; },
  soll(t) { return SOLL[t.art]; },
  pruefe(t, roh) {
    const s = kanonisch(roh.trim().replace(/\s/g, "").replace(".", ","));
    if (s === null) return { gueltig: false };
    return { gueltig: true, richtig: s === t.erg, anzeige: s };
  }
};

function erzeugeSatz(e) {
  const r = mulberry32(e.seed);
  const aufgaben = [];
  for (let i = 0; i < e.runden; i++) {
    const vorher = aufgaben[aufgaben.length - 1];
    let t = null;
    for (let v = 0; v < 10; v++) {
      t = H.erzeuge(r, e);
      if (!vorher || H.text(t) !== H.text(vorher)) break;
    }
    aufgaben.push(t);
  }
  return aufgaben;
}
function einordnen(quote, tempo) {
  const g = KONFIG.genauigkeit.findIndex(([s]) => quote >= s);
  const t = KONFIG.tempo.findIndex(([s]) => tempo >= s);
  return { g, t, text: KONFIG.rueckmeldung[g][t] };
}
function auswerten(liste) {
  const summe = (l, f) => l.reduce((s, x) => s + f(x), 0);
  const m = new Map();
  for (const x of liste) { if (!m.has(x.gruppe)) m.set(x.gruppe, []); m.get(x.gruppe).push(x); }
  const nachGruppe = [...m].map(([k, l]) => ({ k, n: l.length, ok: l.filter(x => x.richtig).length, zeit: summe(l, x => x.sek) / l.length }))
    .sort((a, b) => H.gruppen.indexOf(a.k) - H.gruppen.indexOf(b.k));
  const ok = liste.filter(x => x.richtig).length;
  const tempo = summe(liste, x => x.soll) / Math.max(summe(liste, x => x.sek), 0.001);
  return {
    tempo, feld: einordnen(ok / liste.length, tempo), n: liste.length, ok,
    fehlerquote: 1 - ok / liste.length, zeit: summe(liste, x => x.sek),
    zeitJeAufgabe: summe(liste, x => x.sek) / liste.length,
    nachGruppe, fehler: liste.filter(x => !x.richtig)
  };
}
function bestzeitSchluessel(e) { return JSON.stringify({ ...H.schluessel(e), runden: e.runden }); }
function bestenlisteTitel(e) {
  const s = JSON.stringify(H.schluessel(e));
  const v = H.VORGABEN.find(x => JSON.stringify(H.schluessel(H.ausVorgabe(x))) === s);
  return `${v ? v.name : H.beschreibung(e)}, ${e.runden} ${H.rundenWort}`;
}
function bestenlisteEintragen(liste, schluessel, titel, zeit, datum) {
  const alt = liste[schluessel] ? liste[schluessel].eintraege : [];
  const neu = { zeit, datum };
  const eintraege = [...alt, neu].sort((x, y) => x.zeit - y.zeit).slice(0, KONFIG.listenlaenge);
  const platz = eintraege.indexOf(neu) + 1;
  return { liste: { ...liste, [schluessel]: { titel, eintraege } }, platz, vorher: alt.length ? alt[0].zeit : null };
}

if (typeof module !== "undefined") module.exports = { kanonisch, dez, H, erzeugeSatz, auswerten, bestzeitSchluessel, bestenlisteTitel, bestenlisteEintragen, gruppiert };

if (typeof document !== "undefined") (function () {
  const $ = id => document.getElementById(id);
  const zeit = s => { const m = Math.floor(s / 60); return m + ":" + (s % 60).toFixed(1).padStart(4, "0").replace(".", ","); };
  const pz = x => Math.round(x * 100) + " %";
  const neuerStartwert = () => Math.floor(Math.random() * 4294967296);
  let lauf = null, uhrTakt = null, letzteEinstellung = null;

  function einstellungLesen() {
    const runden = Number($("runden").value);
    if (!Number.isInteger(runden) || runden < 1 || runden > 200) return `${H.rundenWort}: eine ganze Zahl von 1 bis 200.`;
    const e = H.lesen($);
    if (typeof e === "string") return e;
    return { ...e, runden, seed: neuerStartwert() };
  }

  function starten(e) {
    letzteEinstellung = e;
    lauf = { e, aufgaben: erzeugeSatz(e), i: 0, ergebnisse: [], start: performance.now(), t0: performance.now() };
    $("fehler").textContent = "";
    $("einstellung").hidden = true; $("ergebnis").hidden = true; $("uebung").hidden = false;
    $("rueck").textContent = ""; $("rueck").className = "rueck";
    zeigeAufgabe();
    uhrTakt = setInterval(() => { $("uhr").textContent = zeit((performance.now() - lauf.start) / 1000); }, 100);
  }

  function zeigeAufgabe() {
    const t = lauf.aufgaben[lauf.i];
    $("fortschritt").textContent = `Aufgabe ${lauf.i + 1} von ${lauf.aufgaben.length}`;
    $("auftrag").textContent = H.auftrag(t);
    $("term").innerHTML = H.zeige(t);
    if (H.modus === "eingabe") {
      $("einheit").textContent = H.einheit(t);
      $("eingabe").value = "";
      $("eingabe").focus();
    }
    lauf.t0 = performance.now();
  }

  function abgeben(roh) {
    const t = lauf.aufgaben[lauf.i];
    const p = H.pruefe(t, roh);
    if (!p.gueltig) { $("rueck").className = "rueck falsch"; $("rueck").textContent = H.eingabeHinweis; return; }
    const sek = (performance.now() - lauf.t0) / 1000;
    lauf.ergebnisse.push({ gruppe: H.gruppe(t), sek, soll: H.soll(t), richtig: p.richtig, antwort: p.anzeige, text: H.text(t), loesung: H.loesung(t) });
    $("rueck").className = "rueck " + (p.richtig ? "richtig" : "falsch");
    const rueck = p.richtig ? `Richtig: ${H.satz(t)}` : `Falsch: ${H.satz(t)}, nicht ${p.anzeige}`;
    if (H.html) $("rueck").innerHTML = rueck; else $("rueck").textContent = rueck;
    if (++lauf.i < lauf.aufgaben.length) zeigeAufgabe(); else beenden();
  }

  function beenden() {
    clearInterval(uhrTakt);
    const a = auswerten(lauf.ergebnisse);
    $("uebung").hidden = true; $("ergebnis").hidden = false;
    $("stufe").textContent = a.feld.text.replace(/([.!]) /g, "$1\n");
    bestzeitZeigen(a);
    $("kennzahlen").innerHTML = [
      ["Richtig", `${a.ok} von ${a.n}`], ["Fehlerquote", pz(a.fehlerquote)],
      ["Gesamtzeit", zeit(a.zeit)], ["Ø Zeit je Aufgabe", zeit(a.zeitJeAufgabe)]
    ].map(([k, v]) => `<div>${k}<b>${v}</b></div>`).join("");
    const tabelle = (el, kopf, zeilen) => {
      const tab = $(el); tab.textContent = "";
      [kopf, ...zeilen].forEach((z, i) => { const tr = document.createElement("tr"); z.forEach(c => { const td = document.createElement(i ? "td" : "th"); if (H.html) td.innerHTML = c; else td.textContent = c; tr.appendChild(td); }); tab.appendChild(tr); });
    };
    $("gruppenKopf").textContent = "Nach " + H.gruppenName;
    tabelle("tabGruppe", [H.gruppenName, "Aufgaben", "Richtig", "Fehler", "Ø Zeit"], a.nachGruppe.map(g => [g.k, g.n, g.ok, pz(1 - g.ok / g.n), zeit(g.zeit)]));
    $("fehlerKopf").hidden = !a.fehler.length; $("tabFehler").hidden = !a.fehler.length;
    tabelle("tabFehler", ["Aufgabe", "Deine Antwort", "Richtig"], a.fehler.map(f => [f.text, f.antwort, f.loesung]));
    $("nochmal").focus();
  }

  function listeLesen() {
    try { const v = localStorage.getItem(H.speicher); return v ? JSON.parse(v) : {}; } catch (err) { return {}; }
  }
  function listeSchreiben(liste) {
    try { localStorage.setItem(H.speicher, JSON.stringify(liste)); } catch (err) { }
  }
  function bestzeitZeigen(a) {
    const el = $("bestzeit");
    const liste = listeLesen();
    const schluessel = bestzeitSchluessel(lauf.e);
    const bisher = liste[schluessel] ? liste[schluessel].eintraege[0].zeit : null;
    const bestText = bisher === null ? "" : ` Bestzeit: ${zeit(bisher)}.`;
    el.className = "bestzeit leise";
    if (a.ok !== a.n) { el.textContent = `Bestzeit zählt, wenn alle Aufgaben stimmen.${bestText}`; return; }
    const erg = bestenlisteEintragen(liste, schluessel, bestenlisteTitel(lauf.e), a.zeit, new Date().toISOString());
    listeSchreiben(erg.liste);
    if (erg.platz === 1) {
      el.className = "bestzeit";
      el.textContent = erg.vorher === null ? `Erste Bestzeit: ${zeit(a.zeit)}` : `Neue Bestzeit: ${zeit(a.zeit)} (vorher ${zeit(erg.vorher)})`;
    } else if (erg.platz > 1) {
      el.textContent = `Platz ${erg.platz} deiner Bestzeiten: ${zeit(a.zeit)}.${bestText}`;
    } else {
      el.textContent = `Diesmal ${zeit(a.zeit)}.${bestText}`;
    }
  }

  function datumText(iso) {
    const d = new Date(iso);
    return isNaN(d) ? "" : d.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" });
  }
  function bestenlisteZeigen() {
    const liste = listeLesen();
    const reihenfolge = t => { const i = H.VORGABEN.findIndex(v => t.startsWith(v.name + ",")); return i < 0 ? H.VORGABEN.length : i; };
    const eintraege = Object.values(liste).sort((x, y) => reihenfolge(x.titel) - reihenfolge(y.titel) || x.titel.localeCompare(y.titel, "de"));
    const ziel = $("listen");
    ziel.innerHTML = "";
    if (!eintraege.length) { ziel.innerHTML = `<section class="liste"><p>Noch keine Bestzeiten.</p></section>`; return; }
    for (const l of eintraege) {
      const sec = document.createElement("section"); sec.className = "liste";
      const h = document.createElement("h2"); h.textContent = l.titel; sec.appendChild(h);
      const tab = document.createElement("table"); tab.className = "zeiten";
      l.eintraege.forEach((x, i) => {
        const tr = document.createElement("tr");
        if (i === 0) tr.className = "spitze";
        const tz = document.createElement("td"); tz.textContent = zeit(x.zeit);
        const td = document.createElement("td"); td.textContent = datumText(x.datum);
        tr.append(tz, td); tab.appendChild(tr);
      });
      sec.appendChild(tab); ziel.appendChild(sec);
    }
  }

  function zurueck() {
    clearInterval(uhrTakt);
    $("uebung").hidden = true; $("ergebnis").hidden = true; $("einstellung").hidden = false;
    $("start").focus();
  }
  function bereichZeigen(ziel) {
    if (ziel !== "uebung" && !$("uebung").hidden) zurueck();
    document.querySelectorAll("button.nav").forEach(b => { if (b.dataset.ziel === ziel) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
    $("bereich-uebung").hidden = ziel !== "uebung";
    $("bereich-bestenliste").hidden = ziel !== "bestenliste";
    if (ziel === "bestenliste") bestenlisteZeigen();
  }
  const merkSchluessel = H.speicher.replace(":bestenliste", ":einstellung");
  const merkFelder = () => [...document.querySelectorAll("#einstellung input, #einstellung select")].map(el => [el.id || el.name + ":" + el.value, el]);
  function einstellungMerken() {
    const z = {};
    merkFelder().forEach(([k, el]) => { z[k] = el.type === "checkbox" ? el.checked : el.value; });
    try { localStorage.setItem(merkSchluessel, JSON.stringify(z)); } catch (err) { }
  }
  function einstellungHolen() {
    let z = null;
    try { z = JSON.parse(localStorage.getItem(merkSchluessel)); } catch (err) { }
    if (!z) return false;
    merkFelder().forEach(([k, el]) => { if (k in z) { if (el.type === "checkbox") el.checked = z[k]; else el.value = z[k]; } });
    if (![...$("vorgabe").options].some(o => o.value === $("vorgabe").value)) $("vorgabe").value = "";
    return true;
  }

  function vorgabeSetzen(id) {
    const v = H.VORGABEN.find(x => x.id === id);
    if (!v) return;
    H.setzen($, v);
    $("fehler").textContent = "";
    if (H.sichtbarkeit) H.sichtbarkeit($);
  }

  $("zeichen").textContent = H.zeichen || "";
  if (H.modus === "tippen") {
    ["eingabe", "einheit", "ok"].forEach(id => { $(id).hidden = true; });
    $("tasten").hidden = false;
    H.tasten.forEach(k => {
      const b = document.createElement("button"); b.type = "button"; b.textContent = k.label; b.setAttribute("aria-label", k.name);
      b.addEventListener("click", () => abgeben(k.wert));
      $("tasten").appendChild(b);
    });
    document.addEventListener("keydown", ev => {
      if ($("uebung").hidden) return;
      const k = H.tasten.find(x => x.taste === ev.key);
      if (k) { ev.preventDefault(); abgeben(k.wert); }
    });
  } else {
    $("eingabe").inputMode = H.inputMode;
    $("eingabe").style.width = H.eingabeBreite;
    $("eingabe").addEventListener("keydown", ev => { if (ev.key === "Enter") { ev.preventDefault(); abgeben($("eingabe").value); } });
    $("ok").addEventListener("pointerdown", ev => ev.preventDefault());
    $("ok").addEventListener("click", () => { abgeben($("eingabe").value); $("eingabe").focus(); });
  }

  $("vorgabe").innerHTML = H.VORGABEN.map(v => `<option value="${v.id}">${v.name}</option>`).join("") + `<option value="">Eigene Einstellung</option>`;
  $("vorgabe").value = H.VORGABEN[0].id;
  vorgabeSetzen(H.VORGABEN[0].id);
  if (einstellungHolen() && H.sichtbarkeit) H.sichtbarkeit($);
  $("vorgabe").addEventListener("change", () => vorgabeSetzen($("vorgabe").value));
  $("einstellung").addEventListener("input", ev => { if (ev.target.id !== "vorgabe" && ev.target.id !== "runden") { $("vorgabe").value = ""; if (H.sichtbarkeit) H.sichtbarkeit($); } });
  $("einstellung").addEventListener("change", ev => { if (ev.target.id !== "vorgabe" && ev.target.id !== "runden") { $("vorgabe").value = ""; if (H.sichtbarkeit) H.sichtbarkeit($); } });

  ["input", "change"].forEach(t => $("einstellung").addEventListener(t, einstellungMerken));

  $("start").addEventListener("click", () => {
    const e = einstellungLesen();
    if (typeof e === "string") { $("fehler").textContent = e; return; }
    starten(e);
  });
  $("abbruch").addEventListener("click", zurueck);
  $("nochmal").addEventListener("click", () => starten({ ...letzteEinstellung, seed: neuerStartwert() }));
  $("auswahl").addEventListener("click", zurueck);
  document.querySelectorAll("button.nav").forEach(b => b.addEventListener("click", () => bereichZeigen(b.dataset.ziel)));
})();
</script>
</body>
</html>
